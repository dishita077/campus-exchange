<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Campus Exchange</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h1 class="mb-4">Campus Basic Necessities — Available Items</h1>
    <div id="items" class="row"></div>
  </div>

  <script>
    async function loadItems(){
      try {
        const res = await fetch('http://127.0.0.1:5000/items');
        const data = await res.json();
        const container = document.getElementById('items');
        container.innerHTML = '';
        if (!Array.isArray(data) || data.length === 0) {
          container.innerHTML = '<p>No items found. Add some using the backend API.</p>';
          return;
        }
        data.forEach(it => {
          const card = document.createElement('div');
          card.className = 'col-md-4';
          card.innerHTML = `
            <div class="card mb-3">
              <div class="card-body">
                <h5 class="card-title">${it.ItemName}</h5>
                <p class="card-text">${it.Description || ''}</p>
                <p class="card-text"><small>Owner: ${it.OwnerName || 'Unknown'}</small></p>
                <p class="card-text"><small>Status: ${it.Status}</small></p>
              </div>
            </div>`;
          container.appendChild(card);
        });
      } catch (err) {
        document.getElementById('items').innerHTML = '<p class="text-danger">Cannot reach backend. Is it running at http://127.0.0.1:5000 ?</p>';
      }
    }
    loadItems();
  </script>
</body>
</html>
